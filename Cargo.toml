[workspace]
resolver = "2"
members = [
    "crates/unispim-core",
    "crates/unispim-tools",
    "crates/unispim-ime",
    "crates/unispim-tsf",
    "crates/unispim-tsf-reg",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
imekit = "0.2"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.59"
